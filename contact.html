<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact · VELORA</title>
<meta name="description" content="Curated finds, delivered worldwide.">
<link rel="stylesheet" href="css/style.css">
</head>
<body >
<div id="site-header"></div>
<main class="wrap"><div class="page-head"><h1 style="font-size:2.2rem">Contact us</h1><p class="muted">Questions about an order or a product? We're here to help.</p></div>
<div class="two"><form class="card" id="f"><div id="msg"></div>
<div class="field"><label for="name">Name</label><input id="name" name="name" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" required minlength="5"></textarea></div>
<button class="btn">Send message</button></form>
<aside class="card"><h3>Other ways</h3><p>✉️ <a id="mail" href="#"></a></p><p class="muted small">We usually reply within 24 hours.</p></aside></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/contact.js"></script>
<script>
(function(){var ok=window.Store&&getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
if(ok)return;
var d=document.createElement('div');
d.setAttribute('style','font:16px/1.5 system-ui,sans-serif;max-width:620px;margin:40px auto;padding:24px;border:2px solid #b8923f;border-radius:14px;background:#fffaf0;color:#222');
d.innerHTML='<h2 style="margin:0 0 8px">⚠️ Hindi na-load ang design (CSS/JS)</h2><p>Binuksan mo ang page <b>nang hindi kasama ang buong folder</b>. Malamang binuksan mo ito sa loob mismo ng .zip.</p><ol><li>I-<b>right-click</b> ang <code>velora-store.zip</code> → <b>Extract All</b> (Windows) / i-double-click (Mac).</li><li>Buksan ang <b>na-extract na folder</b> at doon i-double-click ang <code>index.html</code>.</li></ol><p style="font-size:14px;color:#666">Dapat magkakasama ang <code>index.html</code>, ang <code>css</code> folder at ang <code>js</code> folder.</p>';
document.body.insertBefore(d,document.body.firstChild);})();
</script>
</body>
</html>
