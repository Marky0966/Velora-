<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop · VELORA</title>
<meta name="description" content="Curated finds, delivered worldwide.">
<link rel="stylesheet" href="css/style.css">
</head>
<body >
<div id="site-header"></div>

<main class="wrap"><div class="page-head"><h1 id="title" style="font-size:2.2rem">All products</h1><p class="muted" id="count"></p></div>
<div class="shop">
  <aside class="filters card">
    <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Search products…"></div>
    <h4>Category</h4><div class="chips" id="cats"></div>
    <h4>Max price: <span id="maxl">Any</span></h4><input id="maxv" type="range" min="1" max="100" style="width:100%;accent-color:var(--accent)">
    <label style="display:flex;gap:8px;margin-top:16px;align-items:center"><input type="checkbox" id="stock"> In stock only</label>
    <button class="btn ghost sm full" id="reset" style="margin-top:16px">Reset filters</button>
  </aside>
  <div>
    <div class="toolbar"><span class="muted small">Sort by</span>
      <select id="sort" aria-label="Sort"><option value="featured">Featured</option><option value="best">Best selling</option><option value="rating">Top rated</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
    <div class="pgrid" id="grid"></div>
    <div class="empty" id="empty" hidden><div class="big">🔎</div><h3>No products found</h3><p class="muted">Try different filters or search words.</p></div>
  </div>
</div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/shop.js"></script>
<script>
(function(){var ok=window.Store&&getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
if(ok)return;
var d=document.createElement('div');
d.setAttribute('style','font:16px/1.5 system-ui,sans-serif;max-width:620px;margin:40px auto;padding:24px;border:2px solid #b8923f;border-radius:14px;background:#fffaf0;color:#222');
d.innerHTML='<h2 style="margin:0 0 8px">⚠️ Hindi na-load ang design (CSS/JS)</h2><p>Binuksan mo ang page <b>nang hindi kasama ang buong folder</b>. Malamang binuksan mo ito sa loob mismo ng .zip.</p><ol><li>I-<b>right-click</b> ang <code>velora-store.zip</code> → <b>Extract All</b> (Windows) / i-double-click (Mac).</li><li>Buksan ang <b>na-extract na folder</b> at doon i-double-click ang <code>index.html</code>.</li></ol><p style="font-size:14px;color:#666">Dapat magkakasama ang <code>index.html</code>, ang <code>css</code> folder at ang <code>js</code> folder.</p>';
document.body.insertBefore(d,document.body.firstChild);})();
</script>
</body>
</html>
